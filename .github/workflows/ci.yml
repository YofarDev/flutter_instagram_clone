name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # lib/firebase_options.dart is git-ignored (per-developer config);
      # analyze and the test suite only need it to exist with the right shape.
      - name: Restore firebase_options stub
        run: cp scripts/firebase_options_stub.dart lib/firebase_options.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
